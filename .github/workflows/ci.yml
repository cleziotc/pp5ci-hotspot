name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/pp5ci_hotspot
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v

  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install-vm.sh install-rpi.sh scripts/install-common.sh
      - run: python3 -m py_compile scripts/pp5ci-hotspot-admin.py scripts/pp5ci-hotspot-updater.py
      - run: grep -Fq "www.pistar.uk/downloads/DPlus_Hosts.txt" scripts/pp5ci-hotspot-admin.py
      - run: grep -Fq "www.pistar.uk/downloads/XLXHosts.txt" scripts/pp5ci-hotspot-admin.py
      - run: test -f config/RSSI.dat
      - run: grep -Fxq "RSSIMappingFile=/etc/pp5ci-hotspot/RSSI.dat" config/MMDVM-Host.ini.example
      - name: Reject legacy/private repository references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'polar-mmdvm|polar_mmdvm|Polar MMDVM|cleziotc/polar-mmdvm' .             --exclude-dir=.git --exclude='THIRD_PARTY_NOTICES.md'; then
            echo "Legacy/private project reference found."
            exit 1
          fi
      - name: Validate MMDVMHost live RSSI patch
        run: |
          git clone --quiet https://github.com/g4klx/MMDVM-Host.git /tmp/MMDVM-Host
          git -C /tmp/MMDVM-Host checkout --quiet 590c531391dfd3146073afbc3956f70d42c62a46
          git -C /tmp/MMDVM-Host apply --check "$GITHUB_WORKSPACE/patches/MMDVMHost-live-rssi.patch"
