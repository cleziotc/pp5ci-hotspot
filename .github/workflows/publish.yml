name: Publish Release

on:
  push:
    branches:
      - 'publish/v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate publish branch
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          EXPECTED_BRANCH="publish/v${VERSION}"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test -s "docs/releases/v${VERSION}.md"
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create tag when needed
        shell: bash
        env:
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; release assets will be built from that tag."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "PP5CI Hotspot ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Check out release tag
        shell: bash
        env:
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force || true
          git checkout --detach "${TAG}"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "${TAG}" = "v${VERSION}"
          test -s "docs/releases/${TAG}.md"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend tests
        run: |
          pip install -r backend/requirements.txt
          PYTHONPATH=backend python -m unittest discover -s backend/tests -v

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Installer validation
        run: |
          bash -n install-vm.sh install-rpi.sh scripts/install-common.sh
          python3 -m py_compile scripts/pp5ci-hotspot-admin.py scripts/pp5ci-hotspot-updater.py

      - name: Build release artifact
        shell: bash
        env:
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          set -euo pipefail
          STAGE="/tmp/pp5ci-hotspot-${TAG}"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}"
          tar --exclude='.git' --exclude='frontend/node_modules' --exclude='frontend/dist' -cf - . | tar -xf - -C "${STAGE}"
          mkdir -p "${STAGE}/frontend/dist"
          cp -a frontend/dist/. "${STAGE}/frontend/dist/"
          tar -C /tmp -czf "pp5ci-hotspot-${TAG}.tar.gz" "pp5ci-hotspot-${TAG}"
          sha256sum "pp5ci-hotspot-${TAG}.tar.gz" > "pp5ci-hotspot-${TAG}.tar.gz.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; replacing expected assets."
            gh release upload "${TAG}"               "pp5ci-hotspot-${TAG}.tar.gz"               "pp5ci-hotspot-${TAG}.tar.gz.sha256"               --clobber
          else
            gh release create "${TAG}"               "pp5ci-hotspot-${TAG}.tar.gz"               "pp5ci-hotspot-${TAG}.tar.gz.sha256"               --verify-tag               --title "PP5CI Hotspot ${TAG}"               --notes-file "docs/releases/${TAG}.md"
          fi
