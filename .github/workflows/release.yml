name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate version and notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "$TAG" = "v$VERSION"
          test -s "docs/releases/$TAG.md"

      - name: Backend tests
        run: |
          pip install -r backend/requirements.txt
          PYTHONPATH=backend python -m unittest discover -s backend/tests -v

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Installer validation
        run: |
          bash -n install-vm.sh install-rpi.sh scripts/install-common.sh
          python3 -m py_compile scripts/pp5ci-hotspot-admin.py scripts/pp5ci-hotspot-updater.py

      - name: Build release artifact
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          STAGE="/tmp/pp5ci-hotspot-$TAG"
          mkdir -p "$STAGE"
          tar --exclude='.git' --exclude='frontend/node_modules' --exclude='frontend/dist' -cf - . | tar -xf - -C "$STAGE"
          mkdir -p "$STAGE/frontend/dist"
          cp -a frontend/dist/. "$STAGE/frontend/dist/"
          tar -C /tmp -czf "pp5ci-hotspot-$TAG.tar.gz" "pp5ci-hotspot-$TAG"
          sha256sum "pp5ci-hotspot-$TAG.tar.gz" > "pp5ci-hotspot-$TAG.tar.gz.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          gh release create "$TAG"             "pp5ci-hotspot-$TAG.tar.gz"             "pp5ci-hotspot-$TAG.tar.gz.sha256"             --verify-tag             --title "PP5CI Hotspot $TAG"             --notes-file "docs/releases/$TAG.md"
